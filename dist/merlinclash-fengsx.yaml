# FENGSX-MERLIN-TEMPLATE-V1
proxy-groups:
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    proxies:
      - "REJECT"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true
  - name: "美国策略"
    type: select
    proxies:
      - "🤖 AI 服务"
      - "💵 美国金融"
      - "🚀 节点选择"
      - "DIRECT"
  - name: "🚀 节点选择"
    type: select
    include-all: true
    proxies:
      - "♻️ 自动选择"
      - "DIRECT"
      - "REJECT"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇬🇧 英国节点"
      - "🇰🇷 韩国节点"
      - "🌐 其他节点"
  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all: true
    filter: "🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    filter: "🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇺🇸 美国住宅"
    type: url-test
    include-all: true
    filter: "(?=.*(?:🇺🇸|US|USA|America|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约))(?=.*(?:家宽|住宅|Residential|Home Broadband))"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇺🇸 美国普通"
    type: url-test
    include-all: true
    filter: "^(?=.*(?:🇺🇸|US|USA|America|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约))(?!.*(?:家宽|住宅|Residential|Home Broadband)).*$"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇬🇧 英国节点"
    type: url-test
    include-all: true
    filter: "🇬🇧|英国|UK|London|LHR"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇬🇧 英国住宅"
    type: url-test
    include-all: true
    filter: "(?=.*(?:🇬🇧|英国|UK|London|LHR))(?=.*(?:家宽|住宅|Residential|Home Broadband))"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇬🇧 英国普通"
    type: url-test
    include-all: true
    filter: "^(?=.*(?:🇬🇧|英国|UK|London|LHR))(?!.*(?:家宽|住宅|Residential|Home Broadband)).*$"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🇰🇷 韩国节点"
    type: url-test
    include-all: true
    filter: "🇰🇷|韩国|KR|Korea|ICN|SEL"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🌐 其他节点"
    type: url-test
    include-all: true
    filter: "^((?!(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化|🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美|🇬🇧|英国|UK|London|LHR|🇰🇷|韩国|KR|Korea|ICN|SEL)).)*$"
    proxies:
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 0
    lazy: true
  - name: "🧱 DNS 防泄露"
    type: select
    proxies:
      - "REJECT"
      - "🚀 节点选择"
      - "DIRECT"
  - name: "🤖 AI 服务"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "📹 油管视频"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "🔍 谷歌服务"
    type: select
    proxies:
      - "🇯🇵 日本节点"
      - "🇭🇰 香港节点"
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "📧 邮件服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "🇯🇵 日本节点"
      - "🇭🇰 香港节点"
      - "REJECT"
  - name: "🍏 苹果服务"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "REJECT"
  - name: "📍 WLOC 定位"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "REJECT"
  - name: "🍎 苹果推送"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "📲 电报消息"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "🐱 代码托管"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
  - name: "🏦 汇丰香港"
    type: select
    proxies:
      - "DIRECT"
      - "🇭🇰 香港节点"
      - "🚀 节点选择"
      - "REJECT"
  - name: "🏦 香港银行"
    type: select
    proxies:
      - "DIRECT"
      - "🇭🇰 香港节点"
      - "🚀 节点选择"
      - "REJECT"
  - name: "📈 券商服务"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "DIRECT"
      - "🚀 节点选择"
      - "REJECT"
  - name: "💵 美国金融"
    type: fallback
    proxies:
      - "🇺🇸 美国住宅"
      - "🇺🇸 美国普通"
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
  - name: "💷 英国金融"
    type: fallback
    proxies:
      - "🇬🇧 英国普通"
      - "REJECT"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
  - name: "🏠 私有网络"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "REJECT"
  - name: "🔒 国内服务"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "REJECT"
  - name: "🌍 非中国"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
      - "🇯🇵 日本节点"
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "DIRECT"
      - "REJECT"
      - "🇯🇵 日本节点"
