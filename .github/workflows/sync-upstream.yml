name: Sync upstream rules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查并合并上游
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/LingJingMaster/Shadowrocket-Rules.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '当前 main 已包含上游最新提交。'
            exit 0
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git merge --no-commit --no-ff upstream/main

      - name: 重新应用 fengsx 定制
        if: steps.upstream.outputs.changed == 'true'
        run: python3 scripts/apply_customizations.py

      - name: 编译统一规则清单
        if: steps.upstream.outputs.changed == 'true'
        run: python3 scripts/compile_rules.py

      - name: 验证配置和远程规则
        if: steps.upstream.outputs.changed == 'true'
        run: python3 scripts/validate_config.py --online

      - name: 提交并推送
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --check
          git commit -m 'merge: automatically sync upstream rules'
          git push origin HEAD:main
